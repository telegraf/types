name: Release

on:
  push:
    tags:
      - v*

jobs:
  release:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # --ignore-scripts so `prepare` does not run here; the build is an explicit step
      # below, which keeps a build failure distinguishable from an install failure.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build

      # npm is used only to publish — bun does the install and build.
      - name: Publish to npm
        run: |
          npm config set //registry.npmjs.org/:_authToken ${NPM_TOKEN}
          npm publish --ignore-scripts --access=public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
