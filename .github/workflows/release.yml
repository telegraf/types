name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read
  # npm takes the OIDC token of the run in place of a stored token: trusted publishing.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Trusted publishing needs npm 11.5.1 or later, which Node 24 bundles and Node 22 does not.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # --ignore-scripts so `prepare` does not run here; the build is an explicit step
      # below, which keeps a build failure distinguishable from an install failure.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build

      # npm is used only to publish — bun does the install and build.
      - name: Publish to npm
        run: npm publish --ignore-scripts --access=public
